<main class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- Hero card -->
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-soft border border-white/50 overflow-hidden mb-6">
      <div class="bg-gradient-to-r from-accent-500 to-accent-600 px-6 py-4">
        <header>
          <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white tracking-tight">Sanakampa</h1>
          <p class="text-white/95 text-sm sm:text-base mt-1 font-medium">Suomen kielen sanahaku villikorteilla ja minimipareilla</p>
        </header>
      </div>

      <div class="p-6 space-y-5">
        <div class="relative">
          <app-search-bar (searchTerm)="onSearch($event)" (clearRequested)="onClearSearch()" />
        </div>

        <div class="flex flex-wrap gap-2">
          <button
            (click)="toggleShowHelp()"
            [attr.aria-label]="showHelp ? 'Piilota ohjeet' : 'Näytä ohjeet'"
            [attr.aria-expanded]="showHelp"
            class="inline-flex items-center px-4 py-2.5 rounded-xl font-medium text-gray-700 bg-warm-100 hover:bg-accent-50 hover:text-accent-700 hover:border-accent-200 border border-warm-200 transition-all duration-200 shadow-card cursor-pointer"
          >
            {{ showHelp ? 'Piilota ohjeet' : 'Näytä ohjeet' }}
          </button>
          <button
            (click)="toggleShowMinimumPairs()"
            [attr.aria-label]="showMinimumPairs ? 'Piilota minimiparit' : 'Näytä minimiparit'"
            [attr.aria-expanded]="showMinimumPairs"
            class="inline-flex items-center px-4 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-accent-500 to-accent-600 hover:from-accent-600 hover:to-accent-700 shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer"
          >
            {{ showMinimumPairs ? 'Piilota minimiparit' : 'Näytä minimiparit' }}
          </button>
        </div>
      </div>
    </div>

    <app-help-panel [isOpen]="showHelp" (tryExample)="onTryExample($event)" />

    @if (latestSearchPhrase) {
      <!-- Results card -->
      <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-soft border border-white/50 p-6 mt-6 text-gray-800">
      <dl>
        @if (loading || numberOfWordSlices > 0) {
          <app-loading-spinner />
        }
        <app-results-list
          [words]="words"
          [minimumPairs]="minimumPairs"
          [loading]="loading"
          [showError]="searchError"
          [showMinimumPairs]="showMinimumPairs"
          [searchPhrase]="latestSearchPhrase"
          [numberOfWordSlices]="numberOfWordSlices"
        />
      </dl>
    </div>
    }
  </div>
</main>
